<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>待ち時間計算アプリ</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    :root {
      --clr-bg: #f4f5f7;
      --clr-card: #ffffff;
      --clr-primary: #4a7fa5;
      --clr-primary-light: #deeaf4;
      --clr-text: #2c3e50;
      --clr-sub: #7f8c8d;
      --clr-border: #e0e4e8;
      --clr-orange: #c87941;
      --clr-red: #c94a4a;
      --radius: 12px;
      --shadow: 0 2px 10px rgba(0,0,0,0.07);
      --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
      --dyn-color: #4a7fa5;
      --dyn-bg: #deeaf4;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
      background: var(--clr-bg);
      color: var(--clr-text);
      min-height: 100vh;
      padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px));
      -webkit-text-size-adjust: 100%;
    }

    /* ===== HEADER ===== */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--clr-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px 8px;
      padding-top: max(12px, env(safe-area-inset-top, 12px));
    }
    .app-title { font-size: 17px; font-weight: 700; letter-spacing: 0.06em; }
    .header-gear {
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      background: none; border: none; font-size: 22px; cursor: pointer;
      color: var(--clr-sub); padding: 8px; border-radius: 50%;
      transition: background 0.15s; line-height: 1;
    }
    .header-gear:active { background: var(--clr-border); }

    /* ===== MAIN ===== */
    .main { padding: 0 12px 12px; max-width: 640px; margin: 0 auto; }

    /* ===== WAIT CARD ===== */
    .wait-card {
      background: var(--clr-card); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 14px 18px; margin-bottom: 10px; display: flex; align-items: center;
      min-height: 92px; border-left: 4px solid var(--dyn-color);
      transition: border-left-color 0.6s ease;
    }
    .wait-card-left { flex: 1; }
    .wait-card-label { font-size: 12px; color: var(--clr-sub); margin-bottom: 1px; display: flex; align-items: center; gap: 4px; }
    .wait-time-row { display: flex; align-items: baseline; gap: 2px; cursor: pointer; user-select: none; -webkit-user-select: none; }
    .wait-time-num {
      font-size: 60px; font-weight: 800; line-height: 1;
      color: var(--dyn-color); transition: color 0.6s ease; font-variant-numeric: tabular-nums;
    }
    .wait-time-unit { font-size: 18px; font-weight: 600; color: var(--dyn-color); transition: color 0.6s ease; margin-left: 2px; }
    .wait-status-badge {
      display: inline-block; margin-top: 5px; padding: 2px 14px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
      background: var(--dyn-bg); color: var(--dyn-color);
      transition: background 0.6s ease, color 0.6s ease;
    }
    .wait-card-divider { width: 1px; height: 56px; background: var(--clr-border); margin: 0 16px; flex-shrink: 0; }
    .wait-card-right { min-width: 110px; text-align: right; }
    .pharm-right-label { font-size: 12px; color: var(--clr-sub); margin-bottom: 2px; }
    .pharm-right-count { font-size: 28px; font-weight: 700; color: var(--clr-primary); }
    .pharm-right-count .unit { font-size: 16px; font-weight: 500; }
    .pharm-right-minus { font-size: 11px; color: var(--clr-sub); margin-top: 2px; line-height: 1.4; }

    /* ===== ACTION ROW ===== */
    .action-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .action-btn {
      flex: 1; padding: 10px 4px; border: 1.5px solid var(--clr-border);
      border-radius: 10px; background: var(--clr-card); font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.15s ease; display: flex; align-items: center;
      justify-content: center; gap: 4px; color: var(--clr-text);
      box-shadow: var(--shadow-sm); white-space: nowrap; font-family: inherit;
      -webkit-appearance: none; touch-action: manipulation;
    }
    .action-btn:active { transform: scale(0.96); box-shadow: none; }
    .action-btn.sound-active { border-color: var(--clr-primary); color: var(--clr-primary); }

    /* ===== MAIN GRID ===== */
    .main-grid { display: grid; grid-template-columns: 130px 1fr; gap: 10px; margin-bottom: 10px; }

    /* ===== PANEL CARD ===== */
    .panel-card { background: var(--clr-card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 10px; }
    .panel-title { font-size: 12px; font-weight: 600; color: var(--clr-sub); margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }
    .help-icon {
      display: inline-flex; width: 15px; height: 15px; border-radius: 50%;
      border: 1.5px solid var(--clr-sub); font-size: 9px; align-items: center;
      justify-content: center; cursor: pointer; color: var(--clr-sub); flex-shrink: 0; font-weight: 700; line-height: 1;
      touch-action: manipulation;
    }

    /* ===== PHARMACIST BUTTONS ===== */
    .pharm-btn-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
    .pharm-btn {
      width: 100%; padding: 9px 0; border: 1.5px solid var(--clr-border);
      border-radius: 9px; background: var(--clr-card); font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.15s ease; text-align: center; color: var(--clr-text);
      position: relative; font-family: inherit; -webkit-appearance: none; touch-action: manipulation;
    }
    .pharm-btn:active { transform: scale(0.96); }
    .pharm-btn.is-effective { background: var(--clr-primary); color: white; border-color: var(--clr-primary); }
    .pharm-btn.is-effective::after {
      content: '◀'; position: absolute; right: -10px; top: 50%;
      transform: translateY(-50%); font-size: 10px; color: var(--clr-primary);
    }
    .pharm-btn.is-base:not(.is-effective) { border-color: var(--clr-primary); color: var(--clr-primary); background: var(--clr-primary-light); }

    /* ===== MODE TOGGLE ===== */
    .mode-section { margin-bottom: 6px; }
    .mode-label { font-size: 10px; color: var(--clr-sub); text-align: center; margin-bottom: 4px; }
    .mode-row { display: flex; gap: 4px; }
    .mode-btn {
      flex: 1; padding: 6px 0; border: 1.5px solid var(--clr-border); border-radius: 8px;
      background: var(--clr-card); font-size: 11px; font-weight: 600; cursor: pointer;
      transition: all 0.15s ease; text-align: center; color: var(--clr-sub);
      font-family: inherit; -webkit-appearance: none; touch-action: manipulation;
    }
    .mode-btn.active { background: var(--clr-primary); color: white; border-color: var(--clr-primary); }
    .mode-btn:active { transform: scale(0.96); }
    .pharm-status-info { font-size: 10px; color: var(--clr-sub); text-align: center; line-height: 1.7; margin-top: 5px; }

    /* ===== PRESCRIPTION GRID ===== */
    .presc-header-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 5px; }
    .presc-col-head { text-align: center; font-size: 11px; color: var(--clr-sub); line-height: 1.3; }
    .presc-col-sub { font-size: 9px; color: #aaa; display: block; }
    .presc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
    .presc-btn {
      padding: 12px 4px; border: 1.5px solid var(--clr-border); border-radius: 10px;
      background: var(--clr-card); font-size: 15px; font-weight: 700; cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), background 0.15s ease,
                  border-color 0.15s ease, box-shadow 0.15s ease;
      text-align: center; color: var(--clr-text); box-shadow: var(--shadow-sm);
      user-select: none; -webkit-user-select: none; font-family: inherit;
      -webkit-appearance: none; touch-action: manipulation;
    }
    .presc-btn .unit { font-size: 10px; font-weight: 400; }
    .presc-btn.active-row { background: var(--clr-primary); color: white; border-color: var(--clr-primary); box-shadow: 0 3px 10px rgba(74,127,165,0.3); }
    .presc-btn:active { transform: scale(0.96) !important; box-shadow: none !important; }
    /* Long-press visual hint */
    .presc-btn-hint { font-size: 8px; display: block; opacity: 0.6; margin-top: 1px; font-weight: 400; }

    /* ===== BOTTOM PANELS ===== */
    .bottom-panels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
    .sub-panel { background: var(--clr-card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 10px 8px; }
    .sub-panel-title {
      font-size: 12px; font-weight: 600; color: var(--clr-sub); text-align: center;
      margin-bottom: 7px; display: flex; align-items: center; justify-content: center; gap: 3px;
    }
    .sub-panel-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .sub-btn {
      padding: 7px 2px; border: 1.5px solid var(--clr-border); border-radius: 8px;
      background: var(--clr-card); font-size: 9.5px; cursor: pointer; transition: all 0.15s ease;
      text-align: center; line-height: 1.4; color: var(--clr-text); font-family: inherit;
      -webkit-appearance: none; touch-action: manipulation;
    }
    .sub-btn:active { transform: scale(0.96); }
    .sub-btn-time { display: block; font-size: 13px; font-weight: 700; color: var(--clr-primary); }
    .ippo-btns { display: flex; flex-direction: column; gap: 4px; }
    .ippo-btn {
      width: 100%; padding: 10px 2px; border: 1.5px solid var(--clr-border); border-radius: 8px;
      background: var(--clr-card); font-size: 9.5px; cursor: pointer; transition: all 0.15s ease;
      text-align: center; line-height: 1.4; color: var(--clr-text); font-family: inherit;
      -webkit-appearance: none; touch-action: manipulation;
    }
    .ippo-btn:active { transform: scale(0.96); }
    .ippo-btn-time { display: block; font-size: 11px; font-weight: 700; color: var(--clr-primary); }

    /* ===== FREE ADD ===== */
    .free-add-card { background: var(--clr-card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; margin-bottom: 10px; }
    .free-add-title { font-size: 12px; color: var(--clr-sub); margin-bottom: 9px; display: flex; align-items: center; gap: 4px; font-weight: 600; }
    .free-add-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .free-btn {
      padding: 8px 14px; border: 1.5px solid var(--clr-border); border-radius: 20px;
      background: var(--clr-card); font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all 0.15s ease; color: var(--clr-text); font-family: inherit;
      -webkit-appearance: none; touch-action: manipulation;
    }
    .free-btn:active { transform: scale(0.96); background: var(--clr-primary-light); border-color: var(--clr-primary); }
    .free-btn-add {
      padding: 8px 14px; border: 1.5px dashed var(--clr-primary); border-radius: 20px;
      background: transparent; font-size: 13px; font-weight: 600; cursor: pointer;
      color: var(--clr-primary); transition: all 0.15s ease; font-family: inherit;
      -webkit-appearance: none; touch-action: manipulation;
    }
    .free-btn-add:active { transform: scale(0.96); background: var(--clr-primary-light); }

    /* ===== BOTTOM NAV ===== */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 58px;
      background: var(--clr-card); border-top: 1px solid var(--clr-border);
      display: flex; z-index: 100; padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; background: none; border: none; cursor: pointer; font-size: 10px;
      color: var(--clr-sub); transition: color 0.15s; font-family: inherit;
      touch-action: manipulation;
    }
    .nav-item:active { color: var(--clr-primary); }
    .nav-icon { font-size: 18px; line-height: 1; }

    /* ===== OVERLAYS / MODALS ===== */
    .overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      z-index: 200; align-items: center; justify-content: center; padding: 20px;
    }
    .overlay.open { display: flex; }
    .modal {
      background: var(--clr-card); border-radius: 16px; padding: 24px 20px 20px;
      width: 100%; max-width: 340px; box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      animation: modal-in 0.2s ease;
    }
    @keyframes modal-in {
      from { transform: scale(0.92); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: var(--clr-text); }
    .modal-sublabel { font-size: 12px; color: var(--clr-sub); margin-bottom: 6px; font-weight: 500; }
    .modal-input {
      width: 100%; padding: 14px; border: 1.5px solid var(--clr-border); border-radius: 10px;
      font-size: 24px; font-weight: 700; text-align: center; outline: none; color: var(--clr-text);
      margin-bottom: 14px; font-family: inherit; transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    .modal-input:focus { border-color: var(--clr-primary); }
    .modal-input.text-mode { font-size: 15px; font-weight: 500; text-align: left; padding: 12px 14px; }
    .modal-hint { font-size: 11px; color: #aaa; text-align: center; margin-top: -10px; margin-bottom: 14px; }
    .modal-btns { display: flex; gap: 8px; }
    .modal-cancel {
      flex: 1; padding: 12px; border: none; border-radius: 10px; background: var(--clr-bg);
      color: var(--clr-sub); font-size: 14px; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: transform 0.1s; touch-action: manipulation;
    }
    .modal-cancel:active { transform: scale(0.97); }
    .modal-confirm {
      flex: 1; padding: 12px; border: none; border-radius: 10px; background: var(--clr-primary);
      color: white; font-size: 14px; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: transform 0.1s; touch-action: manipulation;
    }
    .modal-confirm:active { transform: scale(0.97); }
    .modal-reset-msg { font-size: 14px; color: var(--clr-sub); line-height: 1.7; margin-bottom: 20px; }

    /* Settings */
    .settings-section { margin-bottom: 14px; }
    .settings-label { font-size: 12px; color: var(--clr-sub); margin-bottom: 6px; font-weight: 500; }
    .settings-row { display: flex; align-items: center; gap: 8px; }
    .settings-input {
      flex: 1; padding: 10px 12px; border: 1.5px solid var(--clr-border); border-radius: 10px;
      font-size: 18px; font-weight: 700; text-align: center; outline: none;
      color: var(--clr-text); font-family: inherit; transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    .settings-input:focus { border-color: var(--clr-primary); }
    .settings-unit { font-size: 13px; color: var(--clr-sub); white-space: nowrap; }
    .settings-divider { height: 1px; background: var(--clr-border); margin: 14px 0; }
    .danger-btn {
      width: 100%; padding: 12px; border: 1.5px solid #e57373; border-radius: 10px;
      background: transparent; color: var(--clr-red); font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: background 0.15s; touch-action: manipulation;
    }
    .danger-btn:active { background: #fdecea; }

    /* Log list */
    .modal-list { max-height: 340px; overflow-y: auto; margin-bottom: 14px; -webkit-overflow-scrolling: touch; }
    .log-item { padding: 9px 0; border-bottom: 1px solid var(--clr-border); font-size: 13px; }
    .log-item:last-child { border-bottom: none; }
    .log-action { font-weight: 600; color: var(--clr-text); }
    .log-result { color: var(--clr-primary); font-weight: 700; }
    .log-time { font-size: 10px; color: var(--clr-sub); margin-top: 2px; }
    .log-empty { text-align: center; color: var(--clr-sub); padding: 24px 0; font-size: 13px; }

    /* Tooltip */
    .tooltip-overlay { display: none; position: fixed; inset: 0; z-index: 300; align-items: center; justify-content: center; padding: 20px; }
    .tooltip-overlay.open { display: flex; }
    .tooltip-box {
      background: rgba(44,62,80,0.92); color: white; padding: 14px 20px; border-radius: 12px;
      font-size: 13px; text-align: center; max-width: 280px; line-height: 1.7;
      animation: modal-in 0.15s ease; pointer-events: none;
    }

    /* Bounce */
    @keyframes btn-bounce {
      0%   { transform: scale(0.96); }
      60%  { transform: scale(1.03); }
      100% { transform: scale(1);    }
    }
    .btn-bounce { animation: btn-bounce 0.28s cubic-bezier(0.34,1.56,0.64,1) !important; }

    /* iPad */
    @media (min-width: 768px) {
      .main { padding: 0 20px 12px; max-width: 720px; }
      .main-grid { grid-template-columns: 155px 1fr; }
      .wait-time-num { font-size: 70px; }
      .presc-btn { padding: 14px 4px; font-size: 17px; }
      .sub-btn { font-size: 11px; }
      .ippo-btn { font-size: 11px; }
    }
  </style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="app-header">
  <h1 class="app-title">待ち時間計算アプリ</h1>
  <button class="header-gear" onclick="openSettings()" aria-label="設定">⚙️</button>
</header>

<!-- ===== MAIN ===== -->
<main class="main">

  <!-- Wait Time Card -->
  <div class="wait-card" id="waitCard">
    <div class="wait-card-left">
      <div class="wait-card-label"><span>🕐</span><span>現在の待ち時間</span></div>
      <div class="wait-time-row" id="waitTimeRow" title="タップして手入力">
        <span class="wait-time-num" id="waitTimeNum">0</span>
        <span class="wait-time-unit">分</span>
      </div>
      <span class="wait-status-badge" id="statusBadge">通常</span>
    </div>
    <div class="wait-card-divider"></div>
    <div class="wait-card-right">
      <div class="pharm-right-label">現在の薬剤師人数</div>
      <div class="pharm-right-count"><span id="effectiveCountDisplay">3</span><span class="unit">人</span></div>
      <div class="pharm-right-minus" id="minusInfoDisplay"></div>
    </div>
  </div>

  <!-- Action Row -->
  <div class="action-row">
    <button class="action-btn" id="manualInputBtn">＋ 手入力</button>
    <button class="action-btn" id="subtractBtn">－ <span id="subtractLabel">5</span>分戻す</button>
    <button class="action-btn sound-active" id="soundToggleBtn">
      <span id="soundIcon">🔊</span> 音：<span id="soundLabel">ON</span>
    </button>
  </div>

  <!-- Main Grid -->
  <div class="main-grid">

    <!-- Left: Pharmacist Panel -->
    <div class="panel-card">
      <div class="panel-title">
        薬剤師人数
        <span class="help-icon" id="pharmHelp">?</span>
      </div>
      <div class="pharm-btn-group">
        <button class="pharm-btn" data-count="3">3人</button>
        <button class="pharm-btn" data-count="2">2人</button>
        <button class="pharm-btn" data-count="1">1人</button>
      </div>
      <div class="mode-section">
        <div class="mode-label">切替モード</div>
        <div class="mode-row">
          <button class="mode-btn" id="modeAuto">自動</button>
          <button class="mode-btn" id="modeManual">手動</button>
        </div>
      </div>
      <div class="pharm-status-info" id="pharmStatusInfo"></div>
    </div>

    <!-- Right: Prescription Grid -->
    <div class="panel-card">
      <div class="panel-title">
        処方の重さ
        <span class="help-icon" id="prescHelp">?</span>
      </div>
      <div class="presc-header-row">
        <div class="presc-col-head">小<span class="presc-col-sub">（軽い処方）</span></div>
        <div class="presc-col-head">中<span class="presc-col-sub">（標準的な処方）</span></div>
        <div class="presc-col-head">大<span class="presc-col-sub">（重い処方）</span></div>
      </div>
      <div class="presc-grid" id="prescGrid">
        <button class="presc-btn" data-pharm="3" data-type="small">4<span class="unit">分</span></button>
        <button class="presc-btn" data-pharm="3" data-type="medium">7<span class="unit">分</span></button>
        <button class="presc-btn" data-pharm="3" data-type="large">10<span class="unit">分</span></button>
        <button class="presc-btn" data-pharm="2" data-type="small">6<span class="unit">分</span></button>
        <button class="presc-btn" data-pharm="2" data-type="medium">9<span class="unit">分</span></button>
        <button class="presc-btn" data-pharm="2" data-type="large">13<span class="unit">分</span></button>
        <button class="presc-btn" data-pharm="1" data-type="small">8<span class="unit">分</span></button>
        <button class="presc-btn" data-pharm="1" data-type="medium">14<span class="unit">分</span></button>
        <button class="presc-btn" data-pharm="1" data-type="large">20<span class="unit">分</span></button>
      </div>
    </div>

  </div>

  <!-- Bottom Panels -->
  <div class="bottom-panels">

    <!-- 軟膏 -->
    <div class="sub-panel">
      <div class="sub-panel-title">軟膏<span class="help-icon" id="ointHelp">?</span></div>
      <div class="sub-panel-btns">
        <button class="sub-btn" id="ointPreBtn">予製あり<span class="sub-btn-time">2分</span></button>
        <button class="sub-btn" id="ointNoBtn">予製なし<span class="sub-btn-time">5分</span></button>
      </div>
    </div>

    <!-- 粉 -->
    <div class="sub-panel">
      <div class="sub-panel-title">粉<span class="help-icon" id="powderHelp">?</span></div>
      <div class="sub-panel-btns">
        <button class="sub-btn" id="powderPreBtn">ディメロあり<span class="sub-btn-time">3分</span></button>

<script>
// ============================================================
//  CONSTANTS (デフォルト値)
// ============================================================
const DEFAULT_TIME_TABLE = {
  3: { small: 4,  medium: 7,  large: 10 },
  2: { small: 6,  medium: 9,  large: 13 },
  1: { small: 8,  medium: 14, large: 20 }
};
const TYPE_LABEL = { small: '小', medium: '中', large: '大' };
const COLOR_NORMAL  = { color: '#4a7fa5', bg: '#deeaf4', badge: '通常' };
const COLOR_WARNING = { color: '#c87941', bg: '#fde8d0', badge: '混雑' };
const COLOR_DANGER  = { color: '#c94a4a', bg: '#fde5e5', badge: '大混雑' };

// ============================================================
//  STATE
// ============================================================
let state = {
  waitTime: 0,
  basePharmacistCount: 3,
  minusOneRemainingTime: 0,
  lastUpdateTimestamp: Date.now(),
  mode: 'auto',
  soundEnabled: true,
  subtractMinutes: 5,
  soundThreshold: 15,
  freeAddValues: [2, 5, 10, 15, 20, 30],
  customTimeTable: {},    // key: '3_small' → number
  customAnnotations: {},  // key: '3_small' → string
  actionLog: []
};

let audioCtx = null;

// ============================================================
//  HELPERS: カスタム値取得
// ============================================================
function getTimeValue(pharmCount, type) {
  const key = `${pharmCount}_${type}`;
  return (state.customTimeTable[key] != null)
    ? state.customTimeTable[key]
    : DEFAULT_TIME_TABLE[pharmCount][type];
}

function getAnnotationText(pharmCount, type) {
  const key = `${pharmCount}_${type}`;
  return state.customAnnotations[key] || `処方（${pharmCount}人/${TYPE_LABEL[type]}）`;
}

// ============================================================
//  INIT
// ============================================================
function init() {
  loadState();
  catchUpTime();
  setupAllButtons();
  renderAll();
  setInterval(tick, 1000);
}

function loadState() {
  try {
    const saved = localStorage.getItem('pharmacyWait_v3');
    if (saved) {
      const parsed = JSON.parse(saved);
      Object.assign(state, parsed);
      // 必須フィールドの補完
      if (!state.customTimeTable)  state.customTimeTable  = {};
      if (!state.customAnnotations) state.customAnnotations = {};
      if (!state.actionLog)        state.actionLog        = [];
      if (!state.freeAddValues)    state.freeAddValues    = [2,5,10,15,20,30];
    }
  } catch(e) {}
}

function saveState() {
  try { localStorage.setItem('pharmacyWait_v3', JSON.stringify(state)); } catch(e) {}
}

function catchUpTime() {
  const now  = Date.now();
  const mins = Math.floor((now - (state.lastUpdateTimestamp || now)) / 60000);
  if (mins > 0) {
    state.waitTime              = Math.max(0, state.waitTime - mins);
    state.minusOneRemainingTime = Math.max(0, state.minusOneRemainingTime - mins);
    state.lastUpdateTimestamp   = now;
    saveState();
  }
}

// ============================================================
//  TIMER
// ============================================================
function tick() {
  const now  = Date.now();
  const mins = Math.floor((now - state.lastUpdateTimestamp) / 60000);
  if (mins > 0) {
    const prev = state.waitTime;
    state.waitTime              = Math.max(0, state.waitTime - mins);
    state.minusOneRemainingTime = Math.max(0, state.minusOneRemainingTime - mins);
    state.lastUpdateTimestamp  += mins * 60000;
    checkSoundBoundary(prev, state.waitTime);
    saveState();
  }
  renderAll();
}

// ============================================================
//  DERIVED
// ============================================================
function getEffective() {
  if (state.mode === 'manual') return state.basePharmacistCount;
  return Math.max(1, state.basePharmacistCount - (state.minusOneRemainingTime > 0 ? 1 : 0));
}

// ============================================================
//  RENDER
// ============================================================
function renderAll() {
  renderWaitCard();
  renderPharmButtons();
  renderPrescGrid();
  renderFreeAdd();
}

function renderWaitCard() {
  const wt  = state.waitTime;
  const eff = getEffective();
  const c   = wt >= 40 ? COLOR_DANGER : wt >= 30 ? COLOR_WARNING : COLOR_NORMAL;

  document.getElementById('waitTimeNum').textContent         = wt;
  document.getElementById('effectiveCountDisplay').textContent = eff;
  document.getElementById('statusBadge').textContent         = c.badge;
  document.documentElement.style.setProperty('--dyn-color', c.color);
  document.documentElement.style.setProperty('--dyn-bg',    c.bg);

  const minusDiv = document.getElementById('minusInfoDisplay');
  minusDiv.textContent = (state.minusOneRemainingTime > 0 && state.mode === 'auto')
    ? `(-1：残り${state.minusOneRemainingTime}分)` : '';

  document.getElementById('subtractLabel').textContent = state.subtractMinutes;
}

function renderPharmButtons() {
  const eff  = getEffective();
  const base = state.basePharmacistCount;
  document.querySelectorAll('.pharm-btn').forEach(btn => {
    const n = parseInt(btn.dataset.count);
    btn.classList.toggle('is-effective', n === eff);
    btn.classList.toggle('is-base',      n === base);
  });
  document.getElementById('modeAuto').classList.toggle('active',   state.mode === 'auto');
  document.getElementById('modeManual').classList.toggle('active', state.mode === 'manual');

  const info = document.getElementById('pharmStatusInfo');
  if (state.mode === 'auto' && state.minusOneRemainingTime > 0)
    info.innerHTML = `ベース：${base}人<br>実効：${eff}人<br>（-1適用中）`;
  else if (state.mode === 'manual')
    info.innerHTML = `手動モード<br>実効：${eff}人`;
  else
    info.innerHTML = `ベース：${base}人<br>実効：${eff}人`;
}

function renderPrescGrid() {
  const eff = getEffective();
  document.querySelectorAll('.presc-btn').forEach(btn => {
    const pc = parseInt(btn.dataset.pharm);
    const tp = btn.dataset.type;
    btn.classList.toggle('active-row', pc === eff);
    // カスタム値を表示に反映
    const mins = getTimeValue(pc, tp);
    btn.innerHTML = `${mins}<span class="unit">分</span>`;
  });
}

function renderFreeAdd() {
  const row = document.getElementById('freeAddRow');
  row.innerHTML = '';
  state.freeAddValues.forEach(v => {
    const btn = document.createElement('button');
    btn.className = 'free-btn';
    btn.textContent = `${v}分`;
    btn.addEventListener('click', () => { addFreeTime(v); bounce(btn); });
    row.appendChild(btn);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'free-btn-add';
  addBtn.textContent = '＋ 追加';
  addBtn.addEventListener('click', openFreeAddDialog);
  row.appendChild(addBtn);
}

// ============================================================
//  ACTIONS
// ============================================================
function addPrescTime(pharmCount, type, btn) {
  const mins  = getTimeValue(pharmCount, type);
  const prev  = state.waitTime;
  state.waitTime += mins;
  checkSoundBoundary(prev, state.waitTime);
  addLog(`${getAnnotationText(pharmCount, type)} +${mins}分`, mins, state.waitTime);
  saveState(); renderAll();
  if (btn) bounce(btn);
}

function addOintment(hasPremade) {
  const prev = state.waitTime;
  if (hasPremade) {
    state.waitTime += 2;
    checkSoundBoundary(prev, state.waitTime);
    addLog('軟膏（予製あり）+2分', 2, state.waitTime);
  } else {
    state.waitTime += 5;
    state.minusOneRemainingTime += 5;
    checkSoundBoundary(prev, state.waitTime);
    addLog('軟膏（予製なし）+5分 / -1×5分', 5, state.waitTime);
  }
  saveState(); renderAll();
}

function addPowder(hasDimelo) {
  const prev = state.waitTime;
  if (hasDimelo) {
    state.waitTime += 3;
    checkSoundBoundary(prev, state.waitTime);
    addLog('粉（ディメロあり）+3分', 3, state.waitTime);
  } else {
    state.waitTime += 6;
    state.minusOneRemainingTime += 6;
    checkSoundBoundary(prev, state.waitTime);
    addLog('粉（ディメロなし）+6分 / -1×6分', 6, state.waitTime);
  }
  saveState(); renderAll();
}

function addFreeTime(minutes) {
  const prev = state.waitTime;
  state.waitTime += minutes;
  checkSoundBoundary(prev, state.waitTime);
  addLog(`自由加算 +${minutes}分`, minutes, state.waitTime);
  saveState(); renderAll();
}

function subtractTime() {
  const prev = state.waitTime;
  state.waitTime = Math.max(0, state.waitTime - state.subtractMinutes);
  checkSoundBoundary(prev, state.waitTime);
  addLog(`${state.subtractMinutes}分戻す`, -(prev - state.waitTime), state.waitTime);
  saveState(); renderAll();
  bounce(document.getElementById('subtractBtn'));
}

function setBase(n) {
  state.basePharmacistCount = n;
  addLog(`薬剤師人数を${n}人に変更`, 0, state.waitTime);
  saveState(); renderAll();
}

function setMode(m) {
  state.mode = m;
  saveState(); renderAll();
}

function toggleSound() {
  state.soundEnabled = !state.soundEnabled;
  const on = state.soundEnabled;
  document.getElementById('soundIcon').textContent  = on ? '🔊' : '🔇';
  document.getElementById('soundLabel').textContent = on ? 'ON'  : 'OFF';
  document.getElementById('soundToggleBtn').classList.toggle('sound-active', on);
  saveState();
}

// ============================================================
//  SOUND（Web Audio API）
// ============================================================
function getAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) { return null; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// 音A: 増加 - 低音「ポン」 0.3秒
function playSoundA() {
  try {
    const ctx = getAudio(); if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(160, ctx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.35, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.3);
  } catch(e) {}
}

// 音B: 減少 - 風鈴「チリーン」 0.6秒 ／ 3オシレーター（880Hz + 1760Hz + 3520Hz）
function playSoundB() {
  try {
    const ctx = getAudio(); if (!ctx) return;
    const t   = ctx.currentTime;
    const dur = 0.6;

    // 各オシレーター：基音・2倍音・4倍音
    const freqs   = [880, 1760, 3520];
    const vols    = [0.30, 0.18, 0.09];
    const decays  = [0.60, 0.50, 0.40]; // 高次倍音ほど早く消える

    freqs.forEach((freq, i) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);
      // わずかにピッチが落ちる（風鈴の共鳴感）
      osc.frequency.exponentialRampToValueAtTime(freq * 0.985, t + dur);

      // 鋭いアタック → 自然な指数減衰
      gain.gain.setValueAtTime(0.001, t);
      gain.gain.linearRampToValueAtTime(vols[i], t + 0.008); // 8ms で立ち上がり
      gain.gain.exponentialRampToValueAtTime(0.001, t + decays[i]);

      osc.start(t); osc.stop(t + dur);
    });
  } catch(e) {}
}

function checkSoundBoundary(prevTime, newTime) {
  if (!state.soundEnabled) return;
  const thr = state.soundThreshold || 15;
  if (prevTime < thr && newTime < thr) return;
  const prevBucket = Math.floor(prevTime / 5);
  const newBucket  = Math.floor(newTime  / 5);
  if (prevBucket === newBucket) return;
  newTime > prevTime ? playSoundA() : playSoundB();
}

// ============================================================
//  PRESC EDIT MODAL（長押し）
// ============================================================
let editingPharm = null;
let editingType  = null;

function openPrescEditModal(pharmCount, type) {
  editingPharm = pharmCount;
  editingType  = type;
  const mins  = getTimeValue(pharmCount, type);
  const defMins = DEFAULT_TIME_TABLE[pharmCount][type];
  const annot = state.customAnnotations[`${pharmCount}_${type}`] || '';

  document.getElementById('prescEditTitle').textContent     = `【${pharmCount}人 / ${TYPE_LABEL[type]}処方】を編集`;
  document.getElementById('prescEditMinutes').value         = mins;
  document.getElementById('prescEditHint').textContent      = `初期値：${defMins}分`;
  document.getElementById('prescEditAnnotation').value      = annot;
  document.getElementById('prescEditAnnotation').placeholder = getAnnotationText(pharmCount, type);

  openOverlay('prescEditOverlay');
  setTimeout(() => {
    const f = document.getElementById('prescEditMinutes');
    f.focus(); f.select();
  }, 100);
}

function confirmPrescEdit() {
  const mins  = parseInt(document.getElementById('prescEditMinutes').value);
  const annot = document.getElementById('prescEditAnnotation').value.trim();
  const key   = `${editingPharm}_${editingType}`;

  if (!isNaN(mins) && mins > 0) state.customTimeTable[key]  = mins;
  state.customAnnotations[key] = annot;

  saveState(); renderPrescGrid();
  closeOverlay('prescEditOverlay');
}

// ============================================================
//  LOG
// ============================================================
function addLog(action, delta, result) {
  const now     = new Date();
  const timeStr = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  state.actionLog.unshift({ action, delta, result, time: timeStr });
  if (state.actionLog.length > 200) state.actionLog.length = 200;
}

function clearLog() {
  state.actionLog = [];
  saveState();
  renderAnnotationList();
}

// ============================================================
//  OVERLAYS
// ============================================================
function openOverlay(id)  { document.getElementById(id).classList.add('open'); }
function closeOverlay(id) { document.getElementById(id).classList.remove('open'); }
// 背景タップで閉じる
function setupOverlayBgClose(id) {
  document.getElementById(id).addEventListener('click', function(e) {
    if (e.target === this) closeOverlay(id);
  });
}

function openManualInput() {
  const f = document.getElementById('manualInputField');
  f.value = state.waitTime || '';
  openOverlay('manualInputOverlay');
  setTimeout(() => { f.focus(); f.select(); }, 100);
}

function confirmManualInput() {
  const val = parseInt(document.getElementById('manualInputField').value);
  if (!isNaN(val) && val >= 0) {
    const prev = state.waitTime;
    state.waitTime = val;
    checkSoundBoundary(prev, val);
    addLog(`手入力 → ${val}分`, val - prev, val);
    saveState(); renderAll();
  }
  closeOverlay('manualInputOverlay');
}

function openIppoDialog() {
  const f = document.getElementById('ippoInputField');
  f.value = '';
  openOverlay('ippoOverlay');
  setTimeout(() => f.focus(), 100);
}

function confirmIppo() {
  const val = parseInt(document.getElementById('ippoInputField').value);
  if (!isNaN(val) && val > 0) {
    state.minusOneRemainingTime += val;
    addLog(`一包化（すぐ受け取り）-1×${val}分`, 0, state.waitTime);
    saveState(); renderAll();
  }
  closeOverlay('ippoOverlay');
}

function openFreeAddDialog() {
  const f = document.getElementById('freeAddInputField');
  f.value = '';
  openOverlay('freeAddOverlay');
  setTimeout(() => f.focus(), 100);
}

function confirmFreeAdd() {
  const val = parseInt(document.getElementById('freeAddInputField').value);
  if (!isNaN(val) && val > 0 && !state.freeAddValues.includes(val)) {
    state.freeAddValues.push(val);
    state.freeAddValues.sort((a, b) => a - b);
    saveState(); renderFreeAdd();
  }
  closeOverlay('freeAddOverlay');
}

function openSettings() {
  document.getElementById('subtractMinSetting').value    = state.subtractMinutes;
  document.getElementById('soundThresholdSetting').value = state.soundThreshold;
  openOverlay('settingsOverlay');
}

function saveSettings() {
  const s = parseInt(document.getElementById('subtractMinSetting').value);
  const t = parseInt(document.getElementById('soundThresholdSetting').value);
  if (!isNaN(s) && s > 0) state.subtractMinutes = s;
  if (!isNaN(t) && t > 0) state.soundThreshold  = t;
  saveState(); renderAll();
  closeOverlay('settingsOverlay');
}

function doReset() {
  localStorage.removeItem('pharmacyWait_v3');
  state = {
    waitTime: 0, basePharmacistCount: 3,
    minusOneRemainingTime: 0, lastUpdateTimestamp: Date.now(),
    mode: 'auto', soundEnabled: true,
    subtractMinutes: 5, soundThreshold: 15,
    freeAddValues: [2,5,10,15,20,30],
    customTimeTable: {}, customAnnotations: {},
    actionLog: []
  };
  saveState(); renderAll();
  closeOverlay('confirmResetOverlay');
  closeOverlay('settingsOverlay');
}

function openAnnotations() { renderAnnotationList(); openOverlay('annotationsOverlay'); }
function renderAnnotationList() {
  const el = document.getElementById('annotationList');
  if (!state.actionLog.length) { el.innerHTML = '<div class="log-empty">操作ログがありません</div>'; return; }
  el.innerHTML = state.actionLog.map(item => `
    <div class="log-item">
      <div><span class="log-action">${escHtml(item.action)}</span>&nbsp;→&nbsp;<span class="log-result">${item.result}分</span></div>
      <div class="log-time">${escHtml(item.time)}</div>
    </div>`).join('');
}

function openHistory() { renderHistoryList(); openOverlay('historyOverlay'); }
function renderHistoryList() {
  const el = document.getElementById('historyList');
  if (!state.actionLog.length) { el.innerHTML = '<div class="log-empty">履歴がありません</div>'; return; }
  el.innerHTML = state.actionLog.map(item => `
    <div class="log-item" style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div>
        <span class="log-action">${escHtml(item.action)}</span><br>
        <span style="font-size:11px;color:#7f8c8d;">待ち時間：<strong>${item.result}分</strong>${item.delta !== 0 ? `（${item.delta > 0 ? '+' : ''}${item.delta}分）` : ''}</span>
      </div>
      <div class="log-time" style="flex-shrink:0;margin-left:8px;text-align:right;">${escHtml(item.time)}</div>
    </div>`).join('');
}

let tooltipTimeout = null;
function showTooltip(text) {
  clearTimeout(tooltipTimeout);
  document.getElementById('tooltipBox').innerHTML = escHtml(text).replace(/\n/g, '<br>');
  document.getElementById('tooltipOverlay').classList.add('open');
  tooltipTimeout = setTimeout(closeTooltip, 3500);
}
function closeTooltip() { document.getElementById('tooltipOverlay').classList.remove('open'); }

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function bounce(el) {
  if (!el) return;
  el.classList.remove('btn-bounce');
  void el.offsetWidth;
  el.classList.add('btn-bounce');
  el.addEventListener('animationend', () => el.classList.remove('btn-bounce'), { once: true });
}

// ============================================================
//  SETUP ALL BUTTONS（iOS 対応イベント登録）
// ============================================================
function setupAllButtons() {
  // -- 待ち時間タップ --
  document.getElementById('waitTimeRow').addEventListener('click', openManualInput);

  // -- アクションボタン --
  document.getElementById('manualInputBtn').addEventListener('click', openManualInput);
  document.getElementById('subtractBtn').addEventListener('click', subtractTime);
  document.getElementById('soundToggleBtn').addEventListener('click', toggleSound);

  // -- 薬剤師人数ボタン --
  document.querySelectorAll('.pharm-btn').forEach(btn => {
    btn.addEventListener('click', () => setBase(parseInt(btn.dataset.count)));
  });

  // -- モードボタン --
  document.getElementById('modeAuto').addEventListener('click',   () => setMode('auto'));
  document.getElementById('modeManual').addEventListener('click', () => setMode('manual'));

  // -- ヘルプアイコン --
  document.getElementById('pharmHelp').addEventListener('click', () =>
    showTooltip('薬剤師人数を選択します。青色（実効人数）が処方時間の計算に使われます。-1適用中は自動で人数が減ります。'));
  document.getElementById('prescHelp').addEventListener('click', () =>
    showTooltip('処方サイズを選択して待ち時間を加算します。ハイライト行が現在の実効人数に対応。\n長押しで時間・注釈を編集できます。'));
  document.getElementById('ointHelp').addEventListener('click', () =>
    showTooltip('軟膏\n予製あり：待ち+2分\n予製なし：待ち+5分＋薬剤師-1（5分間）'));
  document.getElementById('powderHelp').addEventListener('click', () =>
    showTooltip('粉薬\nディメロあり：待ち+3分\nディメロなし：待ち+6分＋薬剤師-1（6分間）'));
  document.getElementById('ippoHelp').addEventListener('click', () =>
    showTooltip('一包化\nすぐ受け取り：薬剤師-1を指定分間適用（待ち時間加算なし）'));
  document.getElementById('freeHelp').addEventListener('click', () =>
    showTooltip('任意の分数を待ち時間に加算します。＋追加で新しいボタンを作れます。'));

  // -- 処方グリッド（長押し対応・iOS完全対応版）--
  setupPrescButtons();

  // -- 軟膏・粉・一包化 --
  document.getElementById('ointPreBtn').addEventListener('click', () => addOintment(true));
  document.getElementById('ointNoBtn').addEventListener('click',  () => addOintment(false));
  document.getElementById('powderPreBtn').addEventListener('click', () => addPowder(true));
  document.getElementById('powderNoBtn').addEventListener('click',  () => addPowder(false));
  document.getElementById('ippoBtn').addEventListener('click', openIppoDialog);

  // -- ナビ --
  document.getElementById('navAnnotations').addEventListener('click', openAnnotations);
  document.getElementById('navSettings').addEventListener('click', openSettings);
  document.getElementById('navHistory').addEventListener('click', openHistory);

  // -- モーダルボタン --
  document.getElementById('manualCancel').addEventListener('click',  () => closeOverlay('manualInputOverlay'));
  document.getElementById('manualConfirm').addEventListener('click', confirmManualInput);
  document.getElementById('ippoCancel').addEventListener('click',    () => closeOverlay('ippoOverlay'));
  document.getElementById('ippoConfirm').addEventListener('click',   confirmIppo);
  document.getElementById('freeAddCancel').addEventListener('click', () => closeOverlay('freeAddOverlay'));
  document.getElementById('freeAddConfirm').addEventListener('click',confirmFreeAdd);
  document.getElementById('prescEditCancel').addEventListener('click',  () => closeOverlay('prescEditOverlay'));
  document.getElementById('prescEditConfirm').addEventListener('click', confirmPrescEdit);
  document.getElementById('settingsClose').addEventListener('click', () => closeOverlay('settingsOverlay'));
  document.getElementById('settingsSave').addEventListener('click',  saveSettings);
  document.getElementById('resetBtn').addEventListener('click',      () => openOverlay('confirmResetOverlay'));
  document.getElementById('resetCancel').addEventListener('click',   () => closeOverlay('confirmResetOverlay'));
  document.getElementById('resetConfirm').addEventListener('click',  doReset);
  document.getElementById('clearLogBtn').addEventListener('click',   clearLog);
  document.getElementById('annotationsClose').addEventListener('click', () => closeOverlay('annotationsOverlay'));
  document.getElementById('historyClose').addEventListener('click',  () => closeOverlay('historyOverlay'));

  // -- オーバーレイ背景タップで閉じる --
  ['manualInputOverlay','ippoOverlay','freeAddOverlay','prescEditOverlay',
   'settingsOverlay','confirmResetOverlay','annotationsOverlay','historyOverlay'].forEach(id => {
    setupOverlayBgClose(id);
  });

  // -- ツールチップ背景タップで閉じる --
  document.getElementById('tooltipOverlay').addEventListener('click', closeTooltip);

  // -- キーボードショートカット --
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      ['manualInputOverlay','ippoOverlay','freeAddOverlay','prescEditOverlay',
       'settingsOverlay','confirmResetOverlay','annotationsOverlay','historyOverlay'].forEach(closeOverlay);
      closeTooltip(); return;
    }
    if (e.key === 'Enter') {
      const pairs = [
        ['manualInputOverlay', confirmManualInput],
        ['ippoOverlay',        confirmIppo],
        ['freeAddOverlay',     confirmFreeAdd],
        ['prescEditOverlay',   confirmPrescEdit],
        ['settingsOverlay',    saveSettings],
      ];
      for (const [id, fn] of pairs) {
        if (document.getElementById(id).classList.contains('open')) { fn(); return; }
      }
    }
  });

  // -- iOS AudioContext アンロック（touchstart で解放）--
  const unlockAudio = () => {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  };
  document.addEventListener('touchstart', unlockAudio, { passive: true, once: true });
  document.addEventListener('click', unlockAudio, { once: true });
}

// ============================================================
//  処方ボタン：長押し + タップ（iOS 完全対応）
// ============================================================
function setupPrescButtons() {
  document.querySelectorAll('.presc-btn').forEach(btn => {
    const pharmCount = parseInt(btn.dataset.pharm);
    const type       = btn.dataset.type;

    let pressTimer   = null;
    let didLongPress = false;
    let lastTouchEnd = 0;

    const startPress = () => {
      didLongPress = false;
      pressTimer = setTimeout(() => {
        didLongPress = true;
        openPrescEditModal(pharmCount, type);
      }, 600);
    };

    const cancelPress = () => {
      clearTimeout(pressTimer);
      pressTimer = null;
    };

    // ---- Touch events（iOS/Android）----
    btn.addEventListener('touchstart', (e) => {
      startPress();
    }, { passive: true });

    btn.addEventListener('touchmove', () => {
      // スクロール時はキャンセル
      cancelPress();
    }, { passive: true });

    btn.addEventListener('touchend', (e) => {
      cancelPress();
      lastTouchEnd = Date.now();
      if (!didLongPress) {
        e.preventDefault(); // ghost click 防止
        addPrescTime(pharmCount, type, btn);
      }
      // 次のtickでフラグリセット
      setTimeout(() => { didLongPress = false; }, 50);
    });

    btn.addEventListener('touchcancel', () => {
      cancelPress();
      didLongPress = false;
    });

    // ---- Mouse events（デスクトップ）----
    btn.addEventListener('mousedown', () => {
      if (Date.now() - lastTouchEnd < 600) return; // ghost event 無視
      startPress();
    });

    btn.addEventListener('mouseup', cancelPress);
    btn.addEventListener('mouseleave', cancelPress);

    btn.addEventListener('click', (e) => {
      if (Date.now() - lastTouchEnd < 600) return; // touchend 後の ghost click 無視
      if (didLongPress) { didLongPress = false; return; }
      addPrescTime(pharmCount, type, btn);
    });
  });
}
